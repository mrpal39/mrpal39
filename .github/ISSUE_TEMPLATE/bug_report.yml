name: 🐛 Bug Report
description: File a bug report to help identify and fix problems
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please provide as much relevant information as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide detailed steps to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Execute request '...'
        3. See error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: Expected behavior...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots / Stack Traces
      description: Paste any server error traces or terminal logs here.
      render: shell
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where did this occur?
      options:
        - Local Development (Docker / venv)
        - Staging / Testing
        - Production
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
